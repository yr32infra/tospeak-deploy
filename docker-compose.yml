services:
  tospeak:
    image: ghcr.io/sim1222/tts-api:v0.1.0
    hostname: tospeak
    container_name: tospeak__tospeak

    restart: unless-stopped

    environment:
      TTS_API_TOKEN: ${TTS_API_TOKEN:-}
      TTS_MAX_CONCURRENCY: ${TTS_MAX_CONCURRENCY:-1}
      TTS_QUEUE_LIMIT: ${TTS_QUEUE_LIMIT:-8}
      TTS_TIMEOUT_SEC: ${TTS_TIMEOUT_SEC:-30}
      RUST_LOG: ${RUST_LOG:-info}
      TTS_ROOTFS: /opt/tts/rootfs
      TTS_VOICES_CONFIG: /etc/tts/voices.yaml
      TTS_WORK_DIR: /tmp/tts

    volumes:
      - type: bind
        source: ./rootfs
        target: /opt/tts/rootfs
        read_only: true
      - type: bind
        source: ./rootfs/data
        target: /data
        read_only: true
      - type: bind
        source: ./config
        target: /etc/tts
        read_only: true

    tmpfs:
      - /tmp/tts:uid=10001,gid=10001,mode=0700,size=64m

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 512m

    networks:
      - default

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    hostname: cloudflared
    container_name: tospeak__cloudflared

    restart: unless-stopped

    environment:
      TUNNEL_LOGFILE: /dev/stdout

    command: tunnel run --token ${TUNNEL_TOKEN}
    user: root

    deploy:
      resources:
        limits:
          memory: 4096m

    networks:
      default:

networks:
  default:
    name: tospeak__default
